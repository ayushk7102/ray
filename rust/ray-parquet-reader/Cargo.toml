[package]
name = "ray-parquet-reader"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow-array = "58"
arrow-pyarrow = "58"
arrow-schema = "58"
parquet = { version = "58", features = ["arrow"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }

